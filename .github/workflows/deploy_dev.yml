name: 🚀 Deploy ReadMind Dev (Internal Test)

on:
  push:
    branches:
      - qa

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Descarga el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configura Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      # 3️⃣ Instala dependencias
      - name: Install dependencies
        run: flutter pub get

      # 4️⃣ Decodifica Keystore
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks

      # 5️⃣ Crea key.properties
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=my-release-key.jks" >> android/key.properties

      # 6️⃣ 🔥 Decodifica .env.dev ANTES del build
      - name: Decode .env.dev
        run: |
          mkdir -p assets/env
          echo "${{ secrets.ENV_DEV_BASE64 }}" | base64 --decode > assets/env/.env.dev

      # 🟢 6.1️⃣ Decodifica google-services.json (dev)
      - name: Decode google-services.json (dev)
        run: |
          mkdir -p android/app/src/dev
          echo "${{ secrets.GOOGLE_SERVICES_DEV_BASE64 }}" | base64 --decode > android/app/src/dev/google-services.json

      # 7️⃣ Compila el .aab del flavor dev
      - name: Build appbundle (dev)
        run: flutter build appbundle --flavor dev --release --dart-define=FLAVOR=dev

      # 8️⃣ Lista archivos generados
      - name: List built files
        run: ls -l build/app/outputs/bundle/devRelease/

      # 9️⃣ Decodifica JSON de Play Store
      - name: Decode Play Store JSON key
        run: echo "${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}" | base64 --decode > /tmp/playstore_key.json

      # 🔟 Sube a Google Play (Internal track)
      - name: Upload to Google Play (Internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: /tmp/playstore_key.json
          packageName: com.readmind.dev
          releaseFiles: build/app/outputs/bundle/devRelease/app-dev-release.aab
          track: internal
          status: draft

name: 🚀 Deploy ReadMind Dev (Internal Test)

on:
  push:
    branches:
      - qa   # Se ejecuta cuando haces merge de 'dev' a 'qa'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Descarga el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configura Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'  # Ajusta a tu versión actual

      # 3️⃣ Instala dependencias
      - name: Install dependencies
        run: flutter pub get

      # 4️⃣ Compila el .aab del flavor dev
      - name: Build appbundle (dev)
        run: flutter build appbundle --flavor dev --release

      # 5️⃣ Sube el AAB a Google Play (Internal Test)
      - name: Upload to Google Play (Internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.readmind.dev
          releaseFiles: build/app/outputs/bundle/devRelease/app-dev-release.aab
          track: internal
          status: completed